name: Upload KZ AutoJump AMX Plugin

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify pre-compiled plugin
        run: |
          ls -la kz_autojump.amxx
          file kz_autojump.amxx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kz_autojump.amxx
          path: kz_autojump.amxx
          retention-days: 30