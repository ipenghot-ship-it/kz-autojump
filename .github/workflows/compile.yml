name: Compile KZ AutoJump AMX Plugin

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies and build AMX Mod X
        run: |
          apt-get update
          apt-get install -y git gcc g++ clang nasm python3 python3-pip \
            libc6-dev-i386 lib32stdc++-12-dev lib32z1-dev gcc-multilib g++-multilib
          pip3 install ambuild2

      - name: Clone and build AMX Mod X
        run: |
          git clone --depth 1 https://github.com/alliedmodders/amxmodx.git /tmp/amxmodx
          cd /tmp/amxmodx
          mkdir build && cd build
          python3 ../configure.py
          ambuild

      - name: Compile plugin
        run: |
          cd /tmp/amxmodx/build/package/base/addons/amxmodx/scripting
          ./amxxpc -iinclude /github/workspace/kz_autojump.sma -o/github/workspace/kz_autojump.amxx

      - name: Verify output
        run: |
          ls -la /github/workspace/kz_autojump.amxx
          file /github/workspace/kz_autojump.amxx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kz_autojump.amxx
          path: /github/workspace/kz_autojump.amxx
          retention-days: 30