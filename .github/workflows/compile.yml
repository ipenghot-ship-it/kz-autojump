name: Compile KZ AutoJump AMX Plugin

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install 32-bit dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 libgcc-s1:i386 lib32z1

      - name: Download AMX Mod X Base Linux
        run: |
          curl -fL -o amxmodx.tar.gz "https://www.amxmodx.org/amxxdrop/1.10/amxmodx-1.10.0-git5488-base-linux.tar.gz"
          tar -xzf amxmodx.tar.gz

      - name: Compile plugin
        run: |
          cp kz_autojump.sma addons/amxmodx/scripting/kz_autojump.sma
          cp kz_autojump.inc addons/amxmodx/scripting/include/kz_autojump.inc
          cd addons/amxmodx/scripting
          ./compile.sh kz_autojump.sma 2>&1
          # Find the compiled .amxx file (compile.sh may output to different locations)
          find . -name "kz_autojump.amxx" -type f
          cp $(find . -name "kz_autojump.amxx" -type f | head -1) ../../../kz_autojump.amxx

      - name: Verify output
        run: |
          ls -la kz_autojump.amxx
          file kz_autojump.amxx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kz_autojump.amxx
          path: kz_autojump.amxx
          retention-days: 30